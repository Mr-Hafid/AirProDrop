name: AirProDrop
options:
  bundleIdPrefix: com.mrhafid.airpro
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  AirProDropMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: AirProDrop
        LSUIElement: true
        NSLocalNetworkUsageDescription: AirProDrop finds your iPhone nearby to send and receive files.
        NSBonjourServices:
          - _airpro._tcp
    settings:
      base:
        PRODUCT_NAME: AirProDrop
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhafid.airpro.mac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
  AirProDropPhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: AirProDrop
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: AirProDrop finds your Mac nearby to send and receive files.
        NSBonjourServices:
          - _airpro._tcp
    settings:
      base:
        PRODUCT_NAME: AirProDrop
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhafid.airpro.phone
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
