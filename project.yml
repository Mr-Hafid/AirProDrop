name: AirProDrop
options:
  bundleIdPrefix: com.mrhafid.airpro
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: K8HS5K3B93
targets:
  AirProDropMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: AirProDrop
        LSUIElement: true
        NSLocalNetworkUsageDescription: AirProDrop finds your iPhone nearby to send and receive files.
        NSBonjourServices:
          - _airpro._tcp
    settings:
      base:
        PRODUCT_NAME: AirProDrop
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhafid.airpro.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
  AirProDropPhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
    dependencies:
      - target: AirProDropShare
    entitlements:
      path: Phone/AirProDropPhone.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mrhafid.airpro
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: AirProDrop
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: AirProDrop finds your Mac nearby to send and receive files.
        NSBonjourServices:
          - _airpro._tcp
    settings:
      base:
        PRODUCT_NAME: AirProDrop
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhafid.airpro.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  AirProDropShare:
    type: app-extension
    platform: iOS
    sources:
      - Shared
      - ShareExtension
    entitlements:
      path: ShareExtension/AirProDropShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mrhafid.airpro
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: AirProDrop
        NSLocalNetworkUsageDescription: AirProDrop finds your Mac nearby to send files.
        NSBonjourServices:
          - _airpro._tcp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
    settings:
      base:
        PRODUCT_NAME: AirProDropShare
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhafid.airpro.phone.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
